[project]
name = "ia"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sebastián", email = "rictovdel@iespoblenou.org" }
]
requires-python = ">=3.13"
dependencies = [
    "gliner>=0.2.29",
    "notebook>=7.6.3",
    "pymupdf>=1.28.2",
]

[project.scripts]
ia = "ia:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
